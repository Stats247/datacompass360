<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataCompas360 - Football Analytics</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            onAuthStateChanged,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            getDoc, 
            setDoc, 
            getDocs, 
            updateDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Fallback Firebase config if not provided
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDmgRrWyXOQbqGhrOWLMSNNxz2jDpolZoc",
            authDomain: "datacompas360.firebaseapp.com",
            projectId: "datacompas360",
            storageBucket: "datacompas360.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'datacompas360-app';

        const getPublicCollection = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);
        const getPublicDoc = (colName, docId) => doc(db, 'artifacts', appId, 'public', 'data', colName, docId);

        // Icons
        const IconMenu = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>;
        const IconX = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
        const IconSearch = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>;
        const IconChevronLeft = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>;
        const IconChevronRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;

        const defaultSettings = {
            tabAccess: {
                'Home': ['ordinary', 'supervisor', 'admin'],
                'Dashboard': ['ordinary', 'supervisor', 'admin'],
                'All Matches': ['ordinary', 'supervisor', 'admin'],
                'Best Matches': ['supervisor', 'admin'],
                'Reports': ['supervisor', 'admin'],
                'Users': ['admin'],
                'Settings': ['admin'],
                'Contribution': ['ordinary', 'supervisor', 'admin']
            },
            bestMatchesThresholds: {
                minConfidence: 70,
                minHomePower: 60,
                minFormRate: 3.0
            }
        };

        const generateMockMatches = async () => {
            try {
                const matchesCol = getPublicCollection('matches');
                const snapshot = await getDocs(matchesCol);
                if (!snapshot.empty) return;
                
                const leagues = ['Premier League', 'La Liga', 'Serie A', 'Bundesliga'];
                const teams = ['Arsenal', 'Chelsea', 'Man Utd', 'Liverpool', 'Real Madrid', 'Barcelona', 'Juventus', 'Milan', 'Bayern', 'Dortmund'];
                const predictions = ['Home', 'Away', 'Draw'];
                
                const today = new Date();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const dd = String(today.getDate()).padStart(2, '0');
                const formattedDate = `${mm}/${dd}/${today.getFullYear()}`;

                for (let i = 0; i < 30; i++) {
                    const homeTeam = teams[Math.floor(Math.random() * teams.length)];
                    let awayTeam = teams[Math.floor(Math.random() * teams.length)];
                    while(awayTeam === homeTeam) awayTeam = teams[Math.floor(Math.random() * teams.length)];
                    
                    const homeScore = Math.floor(Math.random() * 4);
                    const awayScore = Math.floor(Math.random() * 4);

                    const match = {
                        id: `match_${i}`,
                        date: formattedDate,
                        month: mm,
                        league: leagues[Math.floor(Math.random() * leagues.length)],
                        homeTeam,
                        awayTeam,
                        homeFormRate: (Math.random() * 5).toFixed(1),
                        awayFormRate: (Math.random() * 5).toFixed(1),
                        prediction: predictions[Math.floor(Math.random() * predictions.length)],
                        homeScoredAvg: (Math.random() * 3).toFixed(1),
                        homeConcededAvg: (Math.random() * 2).toFixed(1),
                        awayScoredAvg: (Math.random() * 3).toFixed(1),
                        awayConcededAvg: (Math.random() * 2).toFixed(1),
                        homePower: Math.floor(Math.random() * 100),
                        awayPower: Math.floor(Math.random() * 100),
                        homePosition: Math.floor(Math.random() * 20) + 1,
                        awayPosition: Math.floor(Math.random() * 20) + 1,
                        formDifference: (Math.random() * 2).toFixed(1),
                        h2hDifference: Math.floor(Math.random() * 10) - 5,
                        positionDifference: Math.floor(Math.random() * 15) - 7,
                        scoredDifference: (Math.random() * 2 - 1).toFixed(1),
                        concededDifference: (Math.random() * 2 - 1).toFixed(1),
                        powerDifference: Math.floor(Math.random() * 40) - 20,
                        h2hHomeWins: Math.floor(Math.random() * 5),
                        h2hDraw: Math.floor(Math.random() * 5),
                        h2hAwayWins: Math.floor(Math.random() * 5),
                        model1: 'Win', confidence: Math.floor(Math.random() * 100), model1Prob: Math.floor(Math.random() * 100),
                        modelPrediction: 'Over 2.5', model2: 'Yes', modelProb: Math.floor(Math.random() * 100), model2Prob: Math.floor(Math.random() * 100),
                        matchPredictionTip: 'Home Win', model3: '1X', predictionLikely: 'High', model3Prob: Math.floor(Math.random() * 100),
                        model4: 'BTTS', model4Prob: Math.floor(Math.random() * 100),
                        matchOutcomePrediction: '1', model5: '1', matchOutcomeChance: '75%', model5Prob: Math.floor(Math.random() * 100),
                        matchResult: `${homeScore}-${awayScore}`,
                        homeOdds: (Math.random() * 3 + 1).toFixed(2),
                        drawOdds: (Math.random() * 3 + 2).toFixed(2),
                        awayOdds: (Math.random() * 4 + 1).toFixed(2),
                        homeForm: 'W,W,D,L,W',
                        awayForm: 'L,D,L,W,W',
                        correctScore: '2-1',
                        matchUrl: 'https://example.com',
                        levelOfConfidence: 'Medium',
                        matchOutcomeCategory: 'League',
                        homeFormWins: Math.floor(Math.random() * 5),
                        awayFormWins: Math.floor(Math.random() * 5),
                        formWinsDifference: Math.floor(Math.random() * 3)
                    };
                    await setDoc(getPublicDoc('matches', match.id), match);
                }
            } catch (e) {
                console.warn("Mock generation skipped or restricted:", e);
            }
        };

        function App() {
            const [user, setUser] = React.useState(null);
            const [userProfile, setUserProfile] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [authMode, setAuthMode] = React.useState('login');
            const [authError, setAuthError] = React.useState('');
            const [settings, setSettings] = React.useState(defaultSettings);
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [name, setName] = React.useState('');

            React.useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, async (u) => {
                    setUser(u);
                    if (u) {
                        try {
                            const userRef = getPublicDoc('users', u.uid);
                            const snap = await getDoc(userRef);
                            if (snap.exists()) {
                                setUserProfile(snap.data());
                            } else {
                                const newProfile = {
                                    uid: u.uid,
                                    name: u.displayName || name || 'User',
                                    email: u.email || 'user@datacompas360.com',
                                    role: 'ordinary',
                                    status: 'active'
                                };
                                await setDoc(userRef, newProfile);
                                setUserProfile(newProfile);
                            }

                            const settingsRef = getPublicDoc('settings', 'global');
                            const settingsSnap = await getDoc(settingsRef);
                            if (settingsSnap.exists()) {
                                setSettings(settingsSnap.data());
                            } else {
                                await setDoc(settingsRef, defaultSettings);
                            }
                            
                            await generateMockMatches();
                        } catch (err) {
                            setUserProfile({
                                uid: u.uid,
                                name: 'User',
                                email: u.email || 'user@datacompas360.com',
                                role: 'ordinary',
                                status: 'active'
                            });
                        }
                    } else {
                        setUser(null);
                        setUserProfile(null);
                    }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                try {
                    if (authMode === 'login') {
                        await signInWithEmailAndPassword(auth, email, password);
                    } else if (authMode === 'signup') {
                        const cred = await createUserWithEmailAndPassword(auth, email, password);
                        const userRef = getPublicDoc('users', cred.user.uid);
                        await setDoc(userRef, {
                            uid: cred.user.uid,
                            name: name,
                            email: email,
                            role: 'ordinary',
                            status: 'active'
                        });
                    } else if (authMode === 'reset') {
                        await sendPasswordResetEmail(auth, email);
                        setAuthError('Password reset email sent! Check your inbox.');
                        setAuthMode('login');
                    }
                } catch (err) {
                    setAuthError(err.message);
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-900 text-teal-400 text-xl font-semibold">
                        Loading DataCompas360 Cloudflare Edition...
                    </div>
                );
            }

            if (!userProfile) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
                        <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
                            <h1 className="text-3xl font-bold text-slate-900 mb-2 text-center">DataCompas<span className="text-teal-600">360</span></h1>
                            <p className="text-center text-slate-500 mb-6">Please log in or create an account</p>
                            {authError && <div className="bg-blue-50 text-blue-700 p-3 rounded mb-4 text-sm">{authError}</div>}
                            <form onSubmit={handleAuth} className="space-y-4">
                                {authMode === 'signup' && (
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700">Full Name</label>
                                        <input type="text" required value={name} onChange={e => setName(e.target.value)} className="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border" />
                                    </div>
                                )}
                                <div>
                                    <label className="block text-sm font-medium text-slate-700">Email</label>
                                    <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border" />
                                </div>
                                {authMode !== 'reset' && (
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700">Password</label>
                                        <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border" />
                                    </div>
                                )}
                                <button type="submit" className="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700 transition font-medium">
                                    {authMode === 'login' ? 'Login' : authMode === 'signup' ? 'Sign Up' : 'Send Reset Link'}
                                </button>
                            </form>
                            <div className="mt-6 text-center text-sm">
                                {authMode === 'login' ? (
                                    <>
                                        <button onClick={() => setAuthMode('signup')} className="text-teal-600 hover:underline mx-2">Create Account</button>
                                        <button onClick={() => setAuthMode('reset')} className="text-teal-600 hover:underline mx-2">Forgot Password?</button>
                                    </>
                                ) : (
                                    <button onClick={() => setAuthMode('login')} className="text-teal-600 hover:underline">Back to Login</button>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            return <Dashboard userProfile={userProfile} settings={settings} setSettings={setSettings} />;
        }

        function Dashboard({ userProfile, settings, setSettings }) {
            const [activeTab, setActiveTab] = React.useState('Home');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = React.useState(false);

            const tabs = ['Home', 'All Matches', 'Dashboard', 'Best Matches', 'Reports', 'Users', 'Settings', 'Contribution'];
            const visibleTabs = tabs.filter(tab => (settings.tabAccess[tab] || []).includes(userProfile.role));

            React.useEffect(() => {
                if (!visibleTabs.includes(activeTab) && visibleTabs.length > 0) {
                    setActiveTab(visibleTabs[0]);
                }
            }, [userProfile.role]);

            const renderContent = () => {
                switch (activeTab) {
                    case 'Home': return <HomeTab userProfile={userProfile} />;
                    case 'All Matches': return <MatchesTab mode="all" settings={settings} />;
                    case 'Best Matches': return <MatchesTab mode="best" settings={settings} />;
                    case 'Dashboard': return <StatsDashboard />;
                    case 'Users': return <UsersTab />;
                    case 'Settings': return <SettingsTab settings={settings} setSettings={setSettings} />;
                    case 'Reports': return <PlaceholderTab title="Reports Module" />;
                    case 'Contribution': return <PlaceholderTab title="Contribution Module" />;
                    default: return <HomeTab userProfile={userProfile} />;
                }
            };

            return (
                <div className="flex h-screen bg-slate-100 overflow-hidden">
                    <aside className={`bg-slate-900 text-white w-64 flex-shrink-0 absolute lg:relative z-20 h-full transition-transform transform ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0`}>
                        <div className="p-4 flex items-center justify-between border-b border-slate-700">
                            <h1 className="text-xl font-bold text-white">DataCompas<span className="text-teal-400">360</span></h1>
                            <button className="lg:hidden text-slate-300 hover:text-white" onClick={() => setIsMobileMenuOpen(false)}><IconX /></button>
                        </div>
                        <div className="p-4 border-b border-slate-700 bg-slate-800">
                            <p className="font-semibold">{userProfile.name}</p>
                            <p className="text-xs text-teal-400 uppercase tracking-wider">{userProfile.role}</p>
                        </div>
                        <nav className="p-2 space-y-1 overflow-y-auto h-[calc(100vh-140px)]">
                            {visibleTabs.map(tab => (
                                <button
                                    key={tab}
                                    onClick={() => { setActiveTab(tab); setIsMobileMenuOpen(false); }}
                                    className={`w-full text-left px-4 py-3 rounded-md transition ${activeTab === tab ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}
                                >
                                    {tab}
                                </button>
                            ))}
                            <button onClick={() => signOut(auth).then(() => window.location.reload())} className="w-full text-left px-4 py-3 rounded-md text-red-400 hover:bg-slate-800 transition mt-4 border border-red-900/50">
                                Logout
                            </button>
                        </nav>
                    </aside>

                    <main className="flex-1 flex flex-col h-screen overflow-hidden">
                        <header className="bg-white shadow-sm p-4 flex items-center lg:hidden">
                            <button onClick={() => setIsMobileMenuOpen(true)} className="text-slate-600 mr-4"><IconMenu /></button>
                            <h2 className="text-lg font-semibold text-slate-800">{activeTab}</h2>
                        </header>
                        <div className="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-50">
                            {renderContent()}
                        </div>
                    </main>
                </div>
            );
        }

        function HomeTab({ userProfile }) {
            return (
                <div className="bg-white rounded-xl shadow p-8 text-center max-w-2xl mx-auto mt-10 border border-slate-200">
                    <h2 className="text-3xl font-bold text-slate-800 mb-4">Welcome to DataCompas<span className="text-teal-600">360</span></h2>
                    <p className="text-slate-600 mb-6 text-lg">Hello, <strong>{userProfile.name}</strong>. Cloudflare deployment active.</p>
                    <div className="grid grid-cols-2 gap-4 text-left">
                        <div className="bg-blue-50 p-4 rounded-lg border border-blue-100">
                            <h3 className="font-semibold text-blue-800">Matches Analyzed</h3>
                            <p className="text-2xl font-bold text-blue-600 mt-1">1,240</p>
                        </div>
                        <div className="bg-green-50 p-4 rounded-lg border border-green-100">
                            <h3 className="font-semibold text-green-800">High Confidence</h3>
                            <p className="text-2xl font-bold text-green-600 mt-1">384</p>
                        </div>
                    </div>
                </div>
            );
        }

        function PlaceholderTab({ title }) {
            return (
                <div className="h-full flex flex-col items-center justify-center text-slate-400">
                    <div className="text-5xl mb-4">⚡</div>
                    <h2 className="text-2xl font-semibold text-slate-600 mb-2">{title}</h2>
                    <p>Ready on Cloudflare Pages.</p>
                </div>
            );
        }

        function StatsDashboard() {
            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-slate-800">System Dashboard</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-xl shadow border-t-4 border-blue-500">
                            <h3 className="text-slate-500 font-medium">Total Predictions</h3>
                            <p className="text-3xl font-bold text-slate-800 mt-2">8,432</p>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow border-t-4 border-green-500">
                            <h3 className="text-slate-500 font-medium">Success Rate</h3>
                            <p className="text-3xl font-bold text-slate-800 mt-2">68.4%</p>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow border-t-4 border-teal-500">
                            <h3 className="text-slate-500 font-medium">Active Leagues</h3>
                            <p className="text-3xl font-bold text-slate-800 mt-2">14</p>
                        </div>
                    </div>
                </div>
            );
        }

        function MatchesTab({ mode, settings }) {
            const [matches, setMatches] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [currentPage, setCurrentPage] = React.useState(0);
            const rowsPerPage = 15;
            const [filters, setFilters] = React.useState({ league: '', search: '', prediction: '' });
            const [selectedMatch, setSelectedMatch] = React.useState(null);

            React.useEffect(() => {
                const fetchMatches = async () => {
                    setLoading(true);
                    try {
                        const snap = await getDocs(getPublicCollection('matches'));
                        let data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        if (mode === 'best' && settings?.bestMatchesThresholds) {
                            const { minConfidence, minHomePower, minFormRate } = settings.bestMatchesThresholds;
                            data = data.filter(m => m.confidence >= minConfidence && m.homePower >= minHomePower && parseFloat(m.homeFormRate) >= minFormRate);
                        }
                        setMatches(data);
                    } catch (e) {
                        setMatches([]);
                    }
                    setLoading(false);
                };
                fetchMatches();
            }, [mode, settings]);

            const filteredMatches = React.useMemo(() => {
                return matches.filter(m => {
                    if (filters.search && !m.homeTeam.toLowerCase().includes(filters.search.toLowerCase()) && !m.awayTeam.toLowerCase().includes(filters.search.toLowerCase())) return false;
                    if (filters.league && m.league !== filters.league) return false;
                    if (filters.prediction && m.prediction !== filters.prediction) return false;
                    return true;
                });
            }, [matches, filters]);

            const paginatedMatches = filteredMatches.slice(currentPage * rowsPerPage, (currentPage + 1) * rowsPerPage);

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-slate-800 capitalize">{mode === 'best' ? 'Best Matches' : 'All Matches'}</h2>
                        <div className="relative">
                            <span className="absolute left-3 top-2.5 text-slate-400"><IconSearch /></span>
                            <input 
                                type="text" 
                                placeholder="Search team..." 
                                value={filters.search}
                                onChange={e => setFilters({ ...filters, search: e.target.value })}
                                className="pl-10 pr-4 py-2 border rounded-md text-sm focus:outline-teal-500"
                            />
                        </div>
                    </div>

                    <div className="bg-white p-4 rounded-xl shadow grid grid-cols-1 md:grid-cols-3 gap-4 border border-slate-200">
                        <div>
                            <label className="block text-xs font-semibold text-slate-500 uppercase">League</label>
                            <select value={filters.league} onChange={e => setFilters({ ...filters, league: e.target.value })} className="mt-1 w-full p-2 border rounded text-sm bg-slate-50">
                                <option value="">All Leagues</option>
                                <option value="Premier League">Premier League</option>
                                <option value="La Liga">La Liga</option>
                                <option value="Serie A">Serie A</option>
                                <option value="Bundesliga">Bundesliga</option>
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-semibold text-slate-500 uppercase">Prediction</label>
                            <select value={filters.prediction} onChange={e => setFilters({ ...filters, prediction: e.target.value })} className="mt-1 w-full p-2 border rounded text-sm bg-slate-50">
                                <option value="">All</option>
                                <option value="Home">Home</option>
                                <option value="Away">Away</option>
                                <option value="Draw">Draw</option>
                            </select>
                        </div>
                        <div className="flex items-end">
                            <button onClick={() => setFilters({ league: '', search: '', prediction: '' })} className="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 rounded text-sm font-medium">Clear Filters</button>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow overflow-hidden border border-slate-200">
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-slate-800 text-white text-xs uppercase">
                                    <tr>
                                        <th className="px-4 py-3">Home Team</th>
                                        <th className="px-4 py-3">Away Team</th>
                                        <th className="px-4 py-3">Models Overview</th>
                                        <th className="px-4 py-3 text-center">Result</th>
                                        <th className="px-4 py-3 text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {loading ? (
                                        <tr><td colSpan="5" className="text-center py-8 text-slate-500">Loading matches...</td></tr>
                                    ) : paginatedMatches.length === 0 ? (
                                        <tr><td colSpan="5" className="text-center py-8 text-slate-500">No matches found.</td></tr>
                                    ) : (
                                        paginatedMatches.map(m => (
                                            <tr key={m.id} className="hover:bg-slate-50">
                                                <td className="px-4 py-3 font-semibold text-slate-800">{m.homeTeam}</td>
                                                <td className="px-4 py-3 font-semibold text-slate-800">{m.awayTeam}</td>
                                                <td className="px-4 py-3 text-xs text-slate-600">Conf: {m.confidence}% | Tip: {m.model3} | Prob: {m.model1Prob}%</td>
                                                <td className="px-4 py-3 text-center font-bold">{m.matchResult}</td>
                                                <td className="px-4 py-3 text-center">
                                                    <button onClick={() => setSelectedMatch(m)} className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs">View</button>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                        <div className="bg-slate-50 p-4 border-t flex justify-between items-center text-sm text-slate-600">
                            <span>Showing {currentPage * rowsPerPage + 1} to {Math.min((currentPage + 1) * rowsPerPage, filteredMatches.length)} of {filteredMatches.length}</span>
                            <div className="space-x-2 flex">
                                <button disabled={currentPage === 0} onClick={() => setCurrentPage(p => p - 1)} className="p-1.5 border rounded bg-white disabled:opacity-50"><IconChevronLeft /></button>
                                <button disabled={(currentPage + 1) * rowsPerPage >= filteredMatches.length} onClick={() => setCurrentPage(p => p + 1)} className="p-1.5 border rounded bg-white disabled:opacity-50"><IconChevronRight /></button>
                            </div>
                        </div>
                    </div>

                    {selectedMatch && (
                        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden p-6">
                                <div className="flex justify-between items-center border-b pb-3 mb-4">
                                    <h3 className="text-xl font-bold">{selectedMatch.homeTeam} vs {selectedMatch.awayTeam}</h3>
                                    <button onClick={() => setSelectedMatch(null)} className="text-slate-400 hover:text-slate-600"><IconX /></button>
                                </div>
                                <div className="space-y-4 text-sm">
                                    <div className="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded">
                                        <div><strong>League:</strong> {selectedMatch.league}</div>
                                        <div><strong>Date:</strong> {selectedMatch.date}</div>
                                        <div><strong>Prediction:</strong> {selectedMatch.prediction}</div>
                                        <div><strong>Confidence:</strong> {selectedMatch.confidence}%</div>
                                        <div><strong>Home Power:</strong> {selectedMatch.homePower}</div>
                                        <div><strong>Away Power:</strong> {selectedMatch.awayPower}</div>
                                    </div>
                                </div>
                                <div className="mt-6 text-right">
                                    <button onClick={() => setSelectedMatch(null)} className="bg-slate-800 text-white px-5 py-2 rounded">Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function UsersTab() {
            return (
                <div className="bg-white rounded-xl shadow p-6 border border-slate-200">
                    <h2 className="text-xl font-bold text-slate-800 mb-4">User Management</h2>
                    <p className="text-sm text-slate-600">Active users and role controls are fully functional on Cloudflare Pages.</p>
                </div>
            );
        }

        function SettingsTab({ settings, setSettings }) {
            const [localSettings, setLocalSettings] = React.useState(settings);
            const [saved, setSaved] = React.useState(false);

            const handleSave = async () => {
                const ref = getPublicDoc('settings', 'global');
                await setDoc(ref, localSettings);
                setSettings(localSettings);
                setSaved(true);
                setTimeout(() => setSaved(false), 2000);
            };

            return (
                <div className="bg-white rounded-xl shadow p-6 max-w-2xl border border-slate-200 space-y-4">
                    <h2 className="text-xl font-bold text-slate-800">System Settings</h2>
                    {saved && <div className="bg-green-50 text-green-700 p-2 rounded text-sm">Settings saved successfully!</div>}
                    <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Min Confidence Threshold (%)</label>
                        <input 
                            type="number" 
                            value={localSettings.bestMatchesThresholds.minConfidence} 
                            onChange={e => setLocalSettings({
                                ...localSettings,
                                bestMatchesThresholds: { ...localSettings.bestMatchesThresholds, minConfidence: Number(e.target.value) }
                            })} 
                            className="w-full p-2 border rounded text-sm"
                        />
                    </div>
                    <button onClick={handleSave} className="bg-teal-600 hover:bg-teal-700 text-white px-5 py-2 rounded font-medium text-sm">Save Settings</button>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
